[build-system]
requires = [
  "setuptools == 84.0.0",
  "setuptools_scm[toml] == 10.2.1",
  "frequenz-repo-config[lib] == 0.18.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pymdownx-superfence-filter-lines"
description = "A custom superfence for pymdown-extensions that can filters lines and plays nice with MkDocs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "frequenz",
  "python",
  "lib",
  "library",
  "pymdownx-superfence-filter-lines",
  "markdown",
  "filter",
  "mkdocs",
  "python3",
  "mkdocs-material",
  "pymdownx",
  "pymdown-extensions",
  "superfence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
requires-python = ">= 3.11, < 4"
dependencies = ["Markdown >= 3.6, < 4", "pymdown-extensions >= 10, < 12"]
dynamic = ["version"]

[[project.authors]]
name = "Frequenz Energy-as-a-Service GmbH"
email = "floss@frequenz.com"

[project.optional-dependencies]
dev-flake8 = [
  "flake8 == 7.3.0",
  "flake8-datetimez == 26.8.1",
  "flake8-docstrings == 1.7.0",
  "flake8-pyproject == 1.2.4", # For reading the flake8 config from pyproject.toml
  "pydoclint == 0.9.1",
  "pydocstyle == 6.3.0",
]
dev-formatting = ["black == 26.5.1", "isort == 8.0.1"]
dev-mkdocs = [
  "black == 26.5.1",
  "Markdown==3.10.3",
  "mike == 2.2.0",
  "mkdocs-gen-files == 0.6.1",
  "mkdocs-literate-nav == 0.6.3",
  "mkdocs-macros-plugin == 1.5.0",
  "mkdocs-material == 9.7.7",
  "mkdocstrings[python] == 1.0.6",
  "mkdocstrings-python == 2.0.7",
  "frequenz-repo-config[lib] == 0.18.0",
]
dev-mypy = [
  "mypy == 2.3.1",
  "types-Markdown == 3.10.2.20260712",
  # For checking the noxfile, docs/ script, and tests
  "pymdownx-superfence-filter-lines[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-noxfile = ["nox == 2026.8.17", "frequenz-repo-config[lib] == 0.18.0"]
dev-pylint = [
  "pylint == 4.0.8",
  # For checking the noxfile, docs/ script, and tests
  "pymdownx-superfence-filter-lines[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-pytest = [
  "pytest == 9.1.1",
  "frequenz-repo-config[extra-lint-examples] == 0.18.0",
  "pytest-mock == 3.15.1",
  "pytest-asyncio == 1.4.0",
  "async-solipsism == 0.9",
]
dev = [
  "pymdownx-superfence-filter-lines[dev-mkdocs,dev-flake8,dev-formatting,dev-mkdocs,dev-mypy,dev-noxfile,dev-pylint,dev-pytest]",
]

[project.urls]
Documentation = "https://frequenz-floss.github.io/pymdownx-superfence-filter-lines-python/"
Changelog = "https://github.com/frequenz-floss/pymdownx-superfence-filter-lines-python/releases"
Issues = "https://github.com/frequenz-floss/pymdownx-superfence-filter-lines-python/issues"
Repository = "https://github.com/frequenz-floss/pymdownx-superfence-filter-lines-python"
Support = "https://github.com/frequenz-floss/pymdownx-superfence-filter-lines-python/discussions/categories/support"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["benchmarks", "examples", "src", "tests"]

[tool.flake8]
# We give some flexibility to go over 88, there are cases like long URLs or
# code in documenation that have extra indentation. Black will still take care
# of making everything that can be 88 wide, 88 wide.
max-line-length = 100
extend-ignore = [
  "E203", # Whitespace before ':' (conflicts with black)
  "W503", # Line break before binary operator (conflicts with black)
]
# pydoclint options
style = "google"
check-return-types = false
check-yield-types = false
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
allow-init-docstring = true

[tool.pylint.similarities]
ignore-comments = ['yes']
ignore-docstrings = ['yes']
ignore-imports = ['no']
min-similarity-lines = 40

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
  # disabled because it conflicts with isort
  "wrong-import-order",
  "ungrouped-imports",
  # pylint's unsubscriptable check is buggy and is not needed because
  # it is a type-check, for which we already have mypy.
  "unsubscriptable-object",
  # Checked by mypy
  "no-member",
  "possibly-used-before-assignment",
  "no-name-in-module",
  # Checked by flake8
  "f-string-without-interpolation",
  "redefined-outer-name",
  "unused-import",
  "line-too-long",
  "missing-function-docstring",
  "unused-variable",
  "unnecessary-lambda-assignment",
]

[tool.pytest.ini_options]
addopts = "-W=all -Werror -Wdefault::DeprecationWarning -Wdefault::PendingDeprecationWarning -vv"
testpaths = ["tests", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "pytest-mock"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
# This option disables mypy cache, and it is sometimes useful to enable it if
# you are getting weird intermittent error, or error in the CI but not locally
# (or vice versa). In particular errors saying that type: ignore is not
# used but getting the original ignored error when removing the type: ignore.
# See for example: https://github.com/python/mypy/issues/2960
#no_incremental = true
modules = ["pymdownx_superfence_filter_lines"]
strict = true

[[tool.mypy.overrides]]
module = ["mkdocs_macros.*", "pymdownx.*", "sybil", "sybil.*"]
ignore_missing_imports = true

[tool.setuptools_scm]
version_scheme = "post-release"
